<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Portafolio Social Media</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" data-fonts href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style id="theme">
/* Layout: portada centrada tipo cartel + carpetas apiladas con pestañas sobre fondo vino. Un solo tema a propósito. */
:root{
  --wine:#5C0F30; --wine-2:#7B1A45; --blush:#F8C6DA; --rose:#F49BC2; --pink:#EE4E98; --cream:#FFEAF3;
  --ink:#4A0C27;
  --display:"Poppins","Arial Black",system-ui,sans-serif;
  --body:"DM Sans","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
html{background:var(--wine)}
body{background:var(--wine);color:var(--cream);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
:focus-visible{outline:3px solid var(--pink);outline-offset:3px;border-radius:6px}

/* ---------- Portada ---------- */
.cover{padding-block:clamp(28px,4vw,48px) clamp(80px,10vw,140px);display:flex;flex-direction:column;gap:clamp(48px,8vw,110px)}
.meta{display:grid;grid-template-columns:1fr;align-items:start;gap:16px;font-family:var(--display);font-size:13px;line-height:1.25}
.meta .r{text-align:right}
.meta b{font-weight:700;display:block}
.meta span{font-weight:500;opacity:.85}
.dot{width:14px;height:14px;border-radius:50%;background:var(--pink);margin-top:3px;box-shadow:0 0 0 6px rgba(238,78,152,.22)}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;padding-top:clamp(8px,3vw,40px)}
.big{font-family:var(--display);font-weight:800;line-height:.86;letter-spacing:-.06em;font-size:clamp(54px,15.5vw,200px);color:var(--cream);margin:0;display:flex;align-items:flex-start;width:max-content;max-width:none;white-space:nowrap}
.ast{width:.36em;height:.36em;color:var(--pink);margin-left:.02em;margin-top:.03em;flex:none;animation:spin 14s linear infinite}
.pillwrap{position:relative;margin-top:clamp(28px,4vw,52px);max-width:100%}
.pill{display:inline-block;background:var(--rose);color:var(--wine);border-radius:999px;padding:.55em 1.3em .6em;font-family:var(--display);font-weight:700;font-size:clamp(14px,2.1vw,26px);letter-spacing:-.01em;line-height:1.25;text-wrap:balance;max-width:100%}
.year{position:absolute;right:clamp(-74px,-6vw,-20px);top:clamp(-46px,-4vw,-24px);transform:rotate(-22deg);font-family:var(--display);font-weight:800;font-size:clamp(26px,4.2vw,52px);letter-spacing:.06em;color:transparent;-webkit-text-stroke:1.6px var(--blush);line-height:1}
.foot{display:flex;justify-content:space-between;align-items:end;gap:16px;font-family:var(--display);font-size:13px;line-height:1.25}
.foot .r{text-align:right}
.foot a{text-decoration:none;display:inline-flex;align-items:center;gap:8px;font-weight:600}
.foot a:hover{color:var(--rose)}

/* ---------- Carpetas ---------- */
.folders{padding-bottom:110px}
/* Cierre: título gigante como la portada + lista de contacto */
.closing{padding-block:clamp(40px,6vw,80px) clamp(90px,10vw,140px);display:flex;flex-direction:column;align-items:center;text-align:center}
.close-hero{width:100%;display:flex;flex-direction:column;align-items:center}
.close-kicker{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--rose)}
.bye{margin:clamp(10px,2vw,20px) 0 0}
.close-text{margin-top:clamp(18px,3vw,30px);font-size:clamp(17px,1.8vw,21px);line-height:1.6;max-width:52ch}
.close-list{width:100%;max-width:640px;margin-top:clamp(32px,5vw,56px);border-top:1.5px solid rgba(255,234,243,.22);text-align:left}
.crow{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1.5px solid rgba(255,234,243,.22);position:relative}
.crow .l{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--rose)}
.crow .v{font-family:var(--display);font-weight:600;font-size:clamp(16px,1.8vw,19px);overflow-wrap:anywhere;user-select:text}
.copy{background:transparent;border:1.5px solid rgba(255,234,243,.35);color:inherit;border-radius:999px;font:600 12px var(--display);padding:5px 12px;cursor:pointer}
.copy:hover{border-color:var(--pink);color:var(--pink)}
.crow .btn.x{position:absolute;right:-8px;top:6px;padding:2px 8px;font-size:11px}
.close-foot{margin-top:clamp(36px,5vw,56px);font:600 13px var(--display);opacity:.75}
@media (max-width:560px){.crow{grid-template-columns:1fr auto}.crow .l{grid-column:1/-1}}
.folder{position:relative}
.folder + .folder{margin-top:-46px}
.tabrow{display:flex;padding:0 clamp(28px,5vw,64px)}
.folder:nth-child(even) .tabrow{justify-content:flex-end}
.tab{position:relative;background:var(--c);color:var(--fg);padding:14px 30px 8px;border-radius:22px 22px 0 0;font-family:var(--display);font-weight:700;font-size:clamp(18px,2.4vw,24px);letter-spacing:-.01em;white-space:nowrap}
.tab::before,.tab::after{content:"";position:absolute;bottom:0;width:22px;height:22px}
.tab::before{left:-22px;background:radial-gradient(circle at 0 0,transparent 21.5px,var(--c) 22px)}
.tab::after{right:-22px;background:radial-gradient(circle at 100% 0,transparent 21.5px,var(--c) 22px)}
.panel{background:var(--c);color:var(--fg);border-radius:30px;padding:clamp(26px,5vw,60px) clamp(20px,5vw,60px) calc(clamp(26px,5vw,60px) + 56px)}
.folder:last-child .panel{padding-bottom:clamp(26px,5vw,60px)}
.f-blush{--c:var(--blush);--fg:var(--ink);--acc:var(--pink)}
.f-rose{--c:var(--rose);--fg:var(--ink);--acc:var(--wine)}

.svcgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,2vw,22px)}
.svc{background:var(--cream);color:var(--ink);border-radius:24px;padding:clamp(20px,2.4vw,28px);display:flex;flex-direction:column;gap:12px;position:relative;min-width:0;transition:transform .2s ease}
.svc:hover{transform:translateY(-4px) rotate(-.6deg)}
.svc .top{display:flex;justify-content:space-between;align-items:flex-start}
.ico{width:64px;height:64px;border-radius:20px;background:var(--wine);color:var(--pink);display:grid;place-items:center;border:0;padding:0;flex:none}
.ico svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.editing .ico{cursor:pointer;outline:1.5px dashed var(--wine);outline-offset:3px}
.svc .num{font-family:var(--display);font-weight:800;font-size:14px;color:var(--pink);font-variant-numeric:tabular-nums}
.svc h3{font-family:var(--display);font-weight:700;letter-spacing:-.02em;line-height:1.12;font-size:clamp(19px,1.9vw,22px);margin:4px 0 0;text-wrap:balance}
.svc p{font-size:15px;line-height:1.5;opacity:.85}
.svc .btn.x{position:absolute;top:10px;right:10px;padding:4px 10px;font-size:12px}
@media (prefers-reduced-motion:reduce){.svc{transition:none}.svc:hover{transform:none}}
.f-pink{--c:var(--pink);--fg:var(--wine);--acc:var(--cream)}
.clients-head{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:clamp(16px,4vw,48px);align-items:end;margin-bottom:clamp(24px,4vw,40px)}
.clients-head h2{font-size:clamp(40px,7vw,92px);line-height:.92;letter-spacing:-.05em;margin:0;color:var(--cream)}
.clients-head p{font-size:clamp(16px,1.6vw,19px);line-height:1.55;font-weight:500}
.logos{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(10px,1.6vw,16px);--cols:4}
.logo{flex:0 0 calc((100% - (var(--cols) - 1) * clamp(10px,1.6vw,16px)) / var(--cols));background:var(--cream);border-radius:20px;aspect-ratio:3/2;max-width:100%;display:grid;place-items:center;position:relative;overflow:hidden;padding:clamp(14px,2vw,26px);text-align:center}
/* Logos con sus colores originales, recortados a su contenido para que pesen igual sobre el fondo claro */
.logo img{position:absolute;left:15%;top:24%;width:70%;height:52%;object-fit:contain;display:block;opacity:0;transition:opacity .25s}
.logo img.ok{opacity:1}
.editing .logo img.ok{opacity:.3}
.logo .nm{font-family:var(--display);font-weight:800;font-size:clamp(16px,1.9vw,22px);letter-spacing:-.03em;line-height:1.1;color:var(--wine);overflow-wrap:anywhere}
.logo.dark{background:var(--wine)}
.logo.dark .nm{color:var(--cream)}
.logo .btn.x{position:absolute;top:8px;right:8px;padding:3px 9px;font-size:12px}
.logo .imgctl{left:8px;bottom:8px}
.logo .imgctl .btn{padding:5px 10px;font-size:12px}
/* Caso (carpeta vino): cabecera con nombre gigante | logo + rol; textos en dos columnas; galería a todo el ancho (vertical | 2×2 cuadradas | vertical) */
.f-wine{--c:var(--wine-2);--fg:var(--cream);--acc:var(--pink)}
.case-top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;padding-bottom:clamp(20px,3vw,32px);border-bottom:2px solid rgba(255,234,243,.25)}
.case-top .kicker{color:var(--rose);opacity:1}
.case-name{font-family:var(--display);font-weight:800;font-size:clamp(52px,9vw,124px);line-height:.88;letter-spacing:-.06em;margin:6px 0 0;color:var(--cream)}
.case-sub{font-family:var(--display);font-weight:600;font-size:clamp(20px,2.6vw,32px);letter-spacing:.02em;color:var(--rose);margin-top:8px}
.case-badge{display:flex;align-items:center;gap:14px}
.clogo{width:clamp(84px,9vw,112px);aspect-ratio:1;border-radius:50%;background:var(--cream);position:relative;flex:none;overflow:hidden}
.clogo img{position:absolute;left:16%;top:28%;width:68%;height:44%;object-fit:contain;opacity:0;transition:opacity .25s}
.clogo img.ok{opacity:1}
.clogo .imgctl{left:50%;bottom:8px;transform:translateX(-50%)}
.clogo .imgctl .btn{padding:3px 8px;font-size:10px}
.rolepill{display:inline-block;background:var(--pink);color:var(--wine);border-radius:999px;padding:8px 18px;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.case-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(20px,4vw,56px);padding-block:clamp(22px,3vw,34px)}
.case-cols .lbl{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--pink);margin-bottom:8px}
.case-cols p{font-size:16px;line-height:1.65}
.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(10px,1.4vw,16px)}
.slot{border-radius:18px;overflow:hidden;position:relative;background:rgba(255,234,243,.06);border:2px dashed rgba(255,234,243,.35);min-width:0;aspect-ratio:4/5}
.slot:first-child{grid-column:span 2;grid-row:span 2;aspect-ratio:auto}
.slot.has{border:0;background:transparent;border-radius:0}
/* contain: la pieza se ve completa, nunca recortada */
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;border-radius:14px}
.ph2,.slot .ph2{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:2px;font-family:var(--display);font-size:13px;letter-spacing:0;line-height:1.3;color:var(--cream);opacity:.7;padding:8px}
.ph2 b,.slot .ph2 b{font-weight:700;font-size:14px}
.ph2 span{font-size:11px;font-weight:500}
/* Sin videos o sin feed (fuera de edición) el collage se reacomoda */
.collage.no-v{grid-template-columns:3fr 1.2fr}
.collage.no-v:not(.no-f) .gallery{display:flex;flex-wrap:wrap;justify-content:center;align-content:center}
.collage.no-v:not(.no-f) .slot{flex:0 0 calc((100% - 2 * clamp(10px,1.4vw,16px)) / 3)}
.collage.no-f{grid-template-columns:2fr 1.15fr}
.collage.no-v.no-f{grid-template-columns:1fr}
.collage.no-v.no-f .gallery{grid-template-columns:repeat(var(--n),minmax(0,1fr))}
.slot .ph2 span{font-size:11px;font-weight:500}
.slot .imgctl{left:8px;bottom:8px;z-index:2}
.slot .imgctl .btn{padding:4px 9px;font-size:11px}
.slot .btn.x{position:absolute;top:8px;right:8px;z-index:2;padding:3px 9px;font-size:11px}
/* Videos dentro de celulares */
.vids-head{margin-top:clamp(36px,5vw,56px);padding-top:clamp(20px,3vw,30px);border-top:2px solid rgba(255,234,243,.25)}
.vids-head .lbl{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--pink)}
.phones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(28px,4vw,48px) clamp(14px,2.4vw,32px);justify-items:center;margin-top:clamp(20px,3vw,32px);padding-bottom:24px}
/* Proporción pensada para que la pantalla quede en 9:16, igual que los reels, sin recortar los lados */
.phone{width:100%;max-width:230px;aspect-ratio:230/396;background:#141016;border-radius:36px;padding:8px;position:relative;box-shadow:0 20px 40px rgba(30,0,15,.45),inset 0 0 0 2px #3b2a33}
.phone:nth-child(3n+2){transform:translateY(24px)}
.phone::after{content:"";position:absolute;right:-3px;top:24%;width:3px;height:12%;background:#2a1e24;border-radius:0 3px 3px 0}
.screen{position:relative;width:100%;height:100%;border-radius:28px;overflow:hidden;background:var(--wine)}
.screen video{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
.island{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:32%;height:17px;background:#141016;border-radius:999px;z-index:2;pointer-events:none}
.snd{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:2;background:rgba(20,16,22,.7);color:var(--cream);border:0;border-radius:999px;padding:5px 12px;font:600 11px var(--display);cursor:pointer;white-space:nowrap}
.phone .imgctl{left:50%;bottom:44px;transform:translateX(-50%);z-index:3}
.phone .btn.x{position:absolute;top:-8px;right:-8px;z-index:3;padding:3px 9px;font-size:11px}
/* Collage tipo presentación: posts 2×3 | 2 videos apilados | iPhone con el feed */
.collage{display:grid;grid-template-columns:2fr 1.15fr 1.75fr;gap:clamp(10px,1.4vw,16px);align-items:stretch}
.collage .gallery{grid-template-columns:repeat(2,minmax(0,1fr))}
.collage .slot:first-child{grid-column:auto;grid-row:auto;aspect-ratio:4/5}
.vcol{display:flex;flex-direction:column;gap:clamp(10px,1.4vw,16px);min-width:0}
.vslot{flex:1;border-radius:18px;overflow:hidden;position:relative;background:rgba(255,234,243,.06);border:2px dashed rgba(255,234,243,.35);min-height:160px}
.vslot.has{border:0;background:#0b0b0f}
.vslot video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
.vslot .imgctl{left:8px;bottom:44px;z-index:3}
.phone.big{max-width:none;aspect-ratio:auto;height:100%;align-self:stretch;border-radius:46px;padding:10px;transform:none;justify-self:stretch}
.phone.big .screen{border-radius:37px;background:#0b0b0f}
.phone.big .screen img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.phone.big .island{top:12px;height:22px;width:30%}
.phone.big .imgctl{bottom:24px}
@media (max-width:760px){
  .collage{grid-template-columns:1fr 1fr}
  .collage .gallery{grid-column:1/-1}
  .phone.big{aspect-ratio:9/19.5;height:auto}
}
/* Sitio web: texto | laptop con la página desplazándose; debajo, 3 ventanas con secciones */
.web{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.5fr);gap:clamp(24px,4vw,56px);align-items:center;margin-top:clamp(20px,3vw,32px)}
.web-title{font-family:var(--display);font-weight:800;font-size:clamp(24px,2.9vw,40px);letter-spacing:-.04em;line-height:1.05;margin:0 0 14px;overflow-wrap:anywhere}
.web-text{min-width:0}
.web-text p{font-size:16px;line-height:1.65}
.web-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.web-tag{border:1.5px solid rgba(255,234,243,.45);border-radius:999px;padding:4px 12px;font:600 13px var(--display)}
.web-link{display:inline-block;margin-top:20px;font:700 14px var(--display);color:var(--pink);text-decoration:none}
a.web-link:hover{text-decoration:underline}
.laptop{position:relative;padding-inline:4%}
.lap-lid{background:#141016;border-radius:18px 18px 4px 4px;padding:10px 10px 14px;box-shadow:0 24px 50px rgba(30,0,15,.45),inset 0 0 0 2px #3b2a33}
.lap-screen{aspect-ratio:16/10;max-width:100%;overflow:hidden;position:relative;border-radius:6px;background:#0b0b20;container-type:size}
.lap-screen img{position:absolute;top:0;left:0;width:100%;height:auto;animation:pagescroll 30s ease-in-out infinite alternate}
.laptop:hover .lap-screen img{animation-play-state:paused}
@keyframes pagescroll{0%,6%{transform:translateY(0)}94%,100%{transform:translateY(calc(-100% + 100cqh))}}
.lap-base{height:14px;margin-inline:-4%;background:linear-gradient(#d9ccd3,#9d8f97);border-radius:2px 2px 14px 14px;position:relative}
.lap-base::before{content:"";position:absolute;left:42%;width:16%;top:0;height:5px;background:#8a7c84;border-radius:0 0 6px 6px}
.laptop .imgctl{left:50%;top:40%;bottom:auto;transform:translateX(-50%)}
/* Eventos online: miniaturas de los talks en grilla de 3 */
/* Reel viral: celular con la interfaz de reel | métricas y comentarios */
.viral{display:grid;grid-template-columns:minmax(0,290px) minmax(0,1fr);gap:clamp(24px,5vw,64px);align-items:center;margin-top:clamp(20px,3vw,32px)}
.phone.vphone{max-width:290px;justify-self:center}
.vphone .screen video,.vphone .screen img{width:100%;height:100%;object-fit:cover;display:block}
.vphone svg{width:22px;height:22px;display:block}
.rv-views{position:absolute;top:36px;left:12px;z-index:2;display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.45);color:#fff;border-radius:999px;padding:3px 9px 3px 6px;font:700 11px var(--display)}
.rv-views svg{width:14px;height:14px}
.rv-side{position:absolute;right:8px;bottom:70px;z-index:2;display:flex;flex-direction:column;gap:14px;align-items:center;color:#fff;font:700 11px var(--display);text-shadow:0 1px 4px rgba(0,0,0,.6)}
.rv-side span{display:flex;flex-direction:column;align-items:center;gap:3px}
.rv-cap{position:absolute;left:12px;right:52px;bottom:46px;z-index:2;color:#fff;font:500 11px/1.35 var(--body);text-shadow:0 1px 4px rgba(0,0,0,.6)}
.rv-cap b{display:block;font:700 12px var(--display);margin-bottom:2px}
.vphone .snd{bottom:12px}
.vstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:22px}
.vstat{background:rgba(255,234,243,.08);border-radius:16px;padding:14px 12px}
.vstat b{display:block;font-family:var(--display);font-weight:800;font-size:clamp(22px,2.6vw,32px);letter-spacing:-.04em;line-height:1;color:var(--pink);font-variant-numeric:tabular-nums}
.vstat span{display:block;margin-top:6px;font-size:13px;opacity:.85}
.vproof{margin:20px 0 0;position:relative;min-height:120px}
/* Recorte a la tarjeta del reel (captura de 910×679; la tarjeta va de x43–860, y15–668) */
.vcrop{aspect-ratio:817/653;max-width:100%;overflow:hidden;border-radius:14px;box-shadow:0 14px 30px rgba(20,0,10,.4)}
.vcrop img{display:block;width:111.38%;max-width:none;height:auto;margin-left:-5.26%;margin-top:-1.84%}
.vproof figcaption{margin-top:8px;font-size:13px;opacity:.75}
.cmts:empty{display:none}
.cmts{display:grid;gap:10px;margin-top:20px}
.cmt{display:flex;gap:10px;align-items:flex-start;background:rgba(255,234,243,.06);border-radius:16px;padding:10px 14px;position:relative}
.cmt .av{flex:none;width:30px;height:30px;border-radius:50%;background:var(--pink);color:var(--wine);display:grid;place-items:center;font:800 13px var(--display)}
.cmt b{display:block;font:700 13px var(--display)}

  const inner=id?`<img src="/_blob/${esc(id)}" alt="${esc(alt||'')}">`:`<div class="ph">${esc(fallback)}</div>`;
  return inner+`<div class="ctl imgctl"><button class="btn light" data-up="${p}">${id?'Cambiar':'Subir'} foto</button>${id?`<button class="btn" data-clear="${p}">Quitar</button>`:''}</div>`;
}

// Prepara un logo conservando sus colores: "luma" quita el fondo blanco, "+inv" oscurece las partes blancas para que se vean sobre crema
const tinted=new Map();
function tint(id,mode){
  const key=id+'|'+mode;
  if(tinted.has(key))return tinted.get(key);
  const p=new Promise((res,rej)=>{
    const im=new Image();
    im.onload=()=>{try{
      const nw=im.naturalWidth||300,nh=im.naturalHeight||150,sc=Math.min(900/nw,500/nh);
      const w=Math.max(1,Math.round(nw*sc)),h=Math.max(1,Math.round(nh*sc));
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      const x=cv.getContext('2d');x.drawImage(im,0,0,w,h);
      const d=x.getImageData(0,0,w,h),a=d.data;
      const luma=mode.startsWith('luma'),dark=mode.startsWith('dark'),inv=mode.endsWith('+inv');
      let x0=w,y0=h,x1=-1,y1=-1;
      for(let i=0;i<a.length;i+=4){
        let r=a[i]/255,g=a[i+1]/255,b=a[i+2]/255,al=a[i+3]/255;
        if(luma){
          const k=Math.max(1-r,1-g,1-b);
          if(k<.04){al=0}else{r=(r-1+k)/k;g=(g-1+k)/k;b=(b-1+k)/k;al*=Math.min(1,k*1.15)}
        }
        if(dark){const k=Math.min(1,Math.max(0,(Math.max(r,g,b)-.2)/.65));al*=k;if(k>0){r=Math.min(1,r/Math.max(k,.01));g=Math.min(1,g/Math.max(k,.01));b=Math.min(1,b/Math.max(k,.01))}}
        if(inv){const mx=Math.max(r,g,b),mn=Math.min(r,g,b);if(mn>.72&&mx-mn<.14){r=35/255;g=31/255;b=32/255}}
        if(al<.06)al=0;
        a[i]=Math.round(r*255);a[i+1]=Math.round(g*255);a[i+2]=Math.round(b*255);a[i+3]=Math.round(al*255);
        if(al){const p=i/4,px=p%w,py=(p-px)/w;if(px<x0)x0=px;if(px>x1)x1=px;if(py<y0)y0=py;if(py>y1)y1=py}
      }
      if(x1<0)return rej(new Error('vacío'));
      x.putImageData(d,0,0);
      const bw=x1-x0+1,bh=y1-y0+1,c2=document.createElement('canvas');c2.width=bw;c2.height=bh;
      c2.getContext('2d').drawImage(cv,x0,y0,bw,bh,0,0,bw,bh);
      res(c2.toDataURL());
    }catch(e){rej(e)}};
    im.onerror=rej;im.src='/_blob/'+id;
  });
  tinted.set(key,p);return p;
}

// El título "Portafolio" ocupa todo el ancho disponible
function fitTitle(){
  [['.hero .big','.hero'],['.close-hero .bye','.close-hero']].forEach(([hs,bs])=>{
  const h=app.querySelector(hs),box=app.querySelector(bs);
  if(!h||!box)return;
  h.style.fontSize='100px';
  const w=h.getBoundingClientRect().width,avail=box.clientWidth;
  if(w>0)h.style.fontSize=Math.max(40,Math.floor(100*avail/w*0.9))+'px';
  });
}
addEventListener('resize',fitTitle);
document.fonts&&document.fonts.ready.then(fitTitle);
app.addEventListener('input',e=>{if(e.target.closest('.big'))fitTitle()});

let bar=null;
function renderBar(){
  if(!canEdit){bar&&bar.remove();bar=null;return}
  if(!bar){bar=document.createElement('div');bar.className='bar';document.body.appendChild(bar)}
  bar.innerHTML=editing
    ?`<span class="msg">${esc(msg||'Haz clic en cualquier texto para editarlo')}</span><button class="btn" data-bar="cancel" ${busy?'disabled':''}>Cancelar</button><button class="btn pink" data-bar="save" ${busy?'disabled':''}>${busy?'Guardando…':'Guardar cambios'}</button>`
    :`${msg?`<span class="msg">${esc(msg)}</span>`:''}<button class="btn" data-bar="edit">✎ Editar portafolio</button>`;
}

function harvest(){
  app.querySelectorAll('[data-p][contenteditable]').forEach(el=>set(el.dataset.p,el.innerText.replace(/ /g,' ').replace(/\n{3,}/g,'\n\n').trim()));
}

const BLANK={'closing.items':{l:'Red',v:'@usuario'},'services':{i:'target',t:'Nuevo servicio',d:'Describe el servicio en una línea.'},'clients.items':{n:'Nueva empresa',logo:''}};

let pendingUp=null;
const file=document.createElement('input');
file.type='file';file.accept='image/png,image/jpeg,image/webp,image/gif';file.hidden=true;file.id='upload-input';
document.body.appendChild(file);
file.addEventListener('change',async()=>{
  const f=file.files[0];file.value='';
  if(!f||!pendingUp)return;
  if(!assets){msg='Subir imágenes no está disponible en esta vista.';renderBar();return}
  msg='Subiendo imagen…';renderBar();
  const isVid=/\.videos\.|\.video$/.test(pendingUp);
  if(isVid)msg='Subiendo video…';renderBar();
  try{const r=await assets.upload(f);harvest();set(pendingUp,r.id);msg=(isVid?'Video listo':'Imagen lista')+'. Recuerda guardar.';render()}
  catch(e){msg=e&&e.code==='too_large'?'El archivo pesa más de 20 MB.':e&&e.code==='unsupported_type'?(isVid?'Usa un video MP4 o WEBM.':'Usa PNG, JPG, WEBP o GIF.'):'No se pudo subir el archivo. Intenta de nuevo.';renderBar()}
});

document.addEventListener('click',async e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.copy!=null&&!editing){
    const v=S.closing.items[+t.dataset.copy].v;
    try{await navigator.clipboard.writeText(v);t.textContent='Copiado'}catch(_){const el=t.previousElementSibling;const r=document.createRange();r.selectNodeContents(el);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);t.textContent='Selecciona y copia'}
    setTimeout(()=>{t.textContent='Copiar'},1600);return;
  }
  if(t.dataset.snd!=null){const v=t.parentElement.querySelector('video');if(v){v.muted=!v.muted;if(!v.muted)v.play().catch(()=>{});t.textContent=v.muted?'Activar sonido':'Silenciar'}return}
  if(t.dataset.bar==='edit'){editing=true;msg='';render();return}
  if(t.dataset.bar==='cancel'){S=JSON.parse(document.getElementById('data').textContent);editing=false;msg='';render();return}
  if(t.dataset.bar==='save'){save();return}
  if(!editing)return;
  if(t.dataset.add){harvest();const b=/\.(gal|videos)$/.test(t.dataset.add)?'':/\.talks\.items$/.test(t.dataset.add)?{t:'Nuevo talk',img:''}:/\.viral\.comments$/.test(t.dataset.add)?{u:'@usuario',t:'Pega aquí un comentario'}:BLANK[t.dataset.add];get(t.dataset.add).push(typeof b==='string'?b:JSON.parse(JSON.stringify(b)));render();return}
  if(t.dataset.del){harvest();const k=t.dataset.del.split('.'),i=+k.pop();get(k.join('.')).splice(i,1);render();return}
  if(t.dataset.inv!=null){harvest();const c=S.clients.items[+t.dataset.inv];c.inv=!c.inv;render();return}
  if(t.dataset.mode!=null){harvest();const c=S.clients.items[+t.dataset.mode];c.mode=c.mode==='luma'?'dark':c.mode==='dark'?'':'luma';render();return}
  if(t.dataset.icon!=null){harvest();const v=S.services[+t.dataset.icon],k=Object.keys(ICONS);v.i=k[(k.indexOf(v.i)+1)%k.length];render();return}
  if(t.dataset.up){pendingUp=t.dataset.up;file.accept=/\.videos\.|\.video$/.test(pendingUp)?'video/mp4,video/webm':'image/png,image/jpeg,image/webp,image/gif';file.click();return}
  if(t.dataset.clear){harvest();set(t.dataset.clear,'');render();return}
});
app.addEventListener('paste',e=>{
  if(!e.target.closest('[contenteditable]'))return;
  e.preventDefault();document.execCommand('insertText',false,(e.clipboardData||window.clipboardData).getData('text/plain'));
});

function buildDoc(){
  const RESET=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
  const q=s=>document.querySelector(s).outerHTML;
  const json=JSON.stringify(S).replace(/</g,'\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'
    +q('title')+'\n'+q('meta[name="claude:viewport-fit-sides"]')+'\n'+q('link[data-fonts]')+'\n'+q('style#theme')
    +'\n\n<div id="app"></div>\n\n<script type="application/json" id="data">'+json+'<\/script>\n\n'+q('script#main')+'\n</body></html>';
}

async function save(){
  if(busy)return;
  harvest();
  if(!art){msg='Guardar no está disponible en esta vista.';renderBar();return}
  busy=true;msg='';renderBar();
  try{await art.publish(buildDoc());msg='Guardado';}
  catch(e){
    const c=e&&e.code;
    msg=c==='conflict'?'Alguien guardó otra versión antes. Cargando la más reciente…'
      :(c==='not_writer'||c==='not_granted'||c==='consent_required')?'Solo tienes permiso de lectura en este portafolio.'
      :c==='too_large'?'El portafolio es demasiado grande para guardarse.'
      :c==='rate_limited'?'Demasiados guardados seguidos. Espera un momento y vuelve a guardar.'
      :'No se pudo guardar. Revisa tu conexión y vuelve a intentarlo.';
    if(c==='not_writer'||c==='not_granted'){canEdit=false;editing=false;render()}
  }
  busy=false;renderBar();
}

render();
(async()=>{
  if(!window.claude||!claude.use)return;
  try{
    const [a,as,u]=await Promise.all([claude.use('artifact'),claude.use('assets'),claude.use('user')]);
    art=a;assets=as;
    let ok=null;try{ok=u?await u.canEdit():null}catch(_){}
    canEdit=!!art&&ok!==false;
    renderBar();
  }catch(_){}
})();
})();
</script>
